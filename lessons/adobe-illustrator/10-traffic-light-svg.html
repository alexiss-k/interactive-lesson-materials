<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Світлофор для сайту: SVG — Adobe Illustrator</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/platform.css">
  <link rel="stylesheet" href="../../assets/css/lesson-kit.css">
  <link rel="stylesheet" href="../../assets/css/task.css">
  <link rel="stylesheet" href="engine/ai-file-check.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="ai-logo">Ai</span> Інтерактивні уроки</a>
  </header>
  <main class="wrap task-page">
    <section id="task-head" class="task-head"><h1>Світлофор для сайту: SVG</h1></section>
    <section id="task-game" class="game-host" aria-label="Практичне завдання">
      <noscript><p class="err">Для виконання завдання увімкніть JavaScript.</p></noscript>
    </section>
    <section id="task-result" class="task-result" hidden aria-live="polite"></section>
    <nav id="task-nav" class="task-nav" aria-label="Інші завдання"></nav>
  </main>

  <script src="../../data/catalog.js"></script>
  <script src="../../assets/js/task-runtime.js"></script>
  <script src="../../assets/js/lesson-kit.js"></script>
  <script src="engine/ai-file-analyzer.js"></script>
  <script src="engine/ai-file-check.js"></script>
  <script src="engine/summaries.js"></script>
  <script>
    TaskRuntime.start({
  "id": "illustrator-10",
  "game": "ai-file-check",
  "data": {
    "sample": "img/task3-sample.svg",
    "sampleAlt": "Біла монтажна область 800 на 600 пікселів, посередині світлофор",
    "sampleCap": "Зразок: світлофор посередині вебдокумента.",
    "steps": [
      "<span class=\"m\">Файл › Створити…</span> <span class=\"k\">Ctrl+N</span> → вкладка <span class=\"m\">Веб</span> <span class=\"en\">(Web)</span> → ширина <b>800</b>, висота <b>600</b>, одиниці <b>Пікселі</b> → перевір <span class=\"m\">Колірний режим: Колір RGB</span> → <span class=\"m\">Створити</span>.",
      "Перейди на вкладку документа <b>02_…</b> зі світлофором → <span class=\"k\">Ctrl+A</span> (виділити все) → <span class=\"k\">Ctrl+C</span>.",
      "Повернися на вкладку нового документа → <span class=\"k\">Ctrl+V</span>. Світлофор можна збільшити: тягни кут рамки із затиснутою <span class=\"k\">Shift</span>.",
      "Постав світлофор посередині: <span class=\"m\">Вирівнювання</span> → <b>вирівняти відносно монтажної області</b> → центри по горизонталі й вертикалі.",
      "<span class=\"m\">Файл › Експорт › Експортувати як…</span> → <b>Тип файлу:</b> <span class=\"m\">SVG (*.SVG)</span> → увімкни ☑ <span class=\"m\">Використовувати монтажні області</span> → ім’я <b>03_Прізвище</b> → <span class=\"m\">Експорт</span>.",
      "У вікні <span class=\"m\">Параметри SVG</span> нічого не змінюй → <b>OK</b>.",
      "Повернися сюди й обери свій SVG нижче."
    ],
    "spec": {
      "formats": [
        "svg"
      ],
      "prefix": "03_",
      "size": {
        "w": 800,
        "h": 600,
        "unit": "px"
      },
      "minObjects": 4,
      "minFills": 3
    }
  },
  "wide": true
});
  </script>
</body>
</html>
