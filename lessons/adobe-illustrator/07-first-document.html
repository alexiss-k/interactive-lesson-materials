  <script>
    TaskRuntime.start({
  "id": "illustrator-07",
  "game": "ai-file-check",
  "data": {
    "sample": "img/task1-sample.svg",
    "sampleAlt": "Білий аркуш A4 з помаранчевим прямокутником",
    "sampleCap": "Зразок: аркуш A4 і одна фігура з заливкою.",
    "steps": [
      "Відкрий Illustrator. <span class=\"m\">Файл › Створити…</span> <span class=\"k\">Ctrl+N</span>.",
      "Угорі вікна обери вкладку <span class=\"m\">Друк</span> <span class=\"en\">(Print)</span> і стиль <span class=\"m\">A4</span>.",
      "Праворуч перевір: ширина <b>210 мм</b>, висота <b>297 мм</b>, орієнтація <b>книжкова</b> (вертикальна).",
      "Розгорни <span class=\"m\">Додаткові параметри</span> <span class=\"en\">(Advanced Options)</span> → <span class=\"m\">Колірний режим: Колір CMYK</span> → <span class=\"m\">Створити</span>.",
      "Глянь на вкладку документа вгорі: у дужках має бути <b>(CMYK/…)</b>.",
      "Інструмент <span class=\"m\">Прямокутник</span> <span class=\"k\">M</span>: протягни мишею на монтажній області.",
      "Дай фігурі колір: панель <span class=\"m\">Властивості</span> → <span class=\"m\">Заливка</span> → будь-який колір.",
      "<span class=\"m\">Файл › Зберегти як…</span> <span class=\"k\">Shift+Ctrl+S</span> → <span class=\"m\">Зберегти на комп’ютері</span> → <b>Тип файлу:</b> <span class=\"m\">Adobe PDF (*.PDF)</span>. Ім’я: <b>01_Прізвище</b> (наприклад, 01_Petrenko) → <span class=\"m\">Зберегти</span> → <span class=\"m\">Зберегти PDF</span>.",
      "Повернися сюди, натисни «Обрати файл…» нижче й обери свій PDF."
    ],
    "spec": {
      "formats": [
        "pdf",
        "ai"
      ],
      "prefix": "01_",
      "illustrator": true,
      "size": {
        "w": 210,
        "h": 297,
        "unit": "mm"
      },
      "orientation": "portrait",
      "color": "CMYK",
      "artboards": 1,
      "minObjects": 1
    }
  },
  "wide": true
});
