  <script>
    TaskRuntime.start({
  "id": "illustrator-09",
  "game": "ai-file-check",
  "data": {
    "sample": "img/task2-sample.svg",
    "sampleAlt": "Світлофор: темно-сірий корпус із чорним обведенням і три кола — червоне, жовте, зелене",
    "sampleCap": "Зразок: корпус 40 × 80 мм і три кола 20 × 20 мм.",
    "steps": [
      "<span class=\"m\">Файл › Створити…</span> <span class=\"k\">Ctrl+N</span> → <span class=\"m\">Друк</span> → задай <b>ширину 100 мм</b> і <b>висоту 100 мм</b> → <span class=\"m\">Колірний режим: Колір CMYK</span> → <span class=\"m\">Створити</span>.",
      "<span class=\"m\">Прямокутник</span> <span class=\"k\">M</span>: <b>один раз клацни</b> на монтажній області → у віконці введи <b>ширину 40 мм</b>, <b>висоту 80 мм</b> → OK. Це корпус.",
      "Корпусу: <span class=\"m\">Заливка</span> — темно-сіра; <span class=\"m\">Обведення</span> — чорне, товщина <b>3 pt</b> (панель <span class=\"m\">Властивості</span> › <span class=\"m\">Оформлення</span>).",
      "<span class=\"m\">Еліпс</span> <span class=\"k\">L</span> (захований під «Прямокутником»): клацни один раз → <b>20 × 20 мм</b> → OK. Заливка — червона, обведення — немає <span class=\"k\">/</span>.",
      "Зроби ще два кола: тягни коло <span class=\"m\">Виділенням</span> <span class=\"k\">V</span> із затиснутою <span class=\"k\">Alt</span> (або <span class=\"k\">Ctrl+C</span>, <span class=\"k\">Ctrl+V</span>). Пофарбуй у жовтий і зелений.",
      "Постав кола в корпус. Виділи корпус і всі кола <span class=\"k\">Shift</span>+клік → <span class=\"m\">Властивості</span> › <span class=\"m\">Вирівнювання</span> → <b>вирівняти центри по горизонталі</b>.",
      "<span class=\"m\">Файл › Зберегти як…</span> <span class=\"k\">Shift+Ctrl+S</span> → <span class=\"m\">Зберегти на комп’ютері</span> → <b>Тип файлу:</b> <span class=\"m\">Adobe PDF (*.PDF)</span>. Ім’я: <b>02_Прізвище</b> → <span class=\"m\">Зберегти</span> → <span class=\"m\">Зберегти PDF</span>.",
      "Повернися сюди й обери свій PDF нижче."
    ],
    "spec": {
      "formats": [
        "pdf",
        "ai"
      ],
      "prefix": "02_",
      "illustrator": true,
      "size": {
        "w": 100,
        "h": 100,
        "unit": "mm"
      },
      "color": "CMYK",
      "minObjects": 4,
      "minFills": 3,
      "needStroke": true
    }
  },
  "wide": true
});
