    "brief": "<p class=\"dc-get\">Ще немає документа? <a class=\"btn small\" href=\"files/naukovyi-visnyk.docx\" download=\"Науковий_вісник.docx\">⬇ Завантаж заготовку «Науковий вісник»<\/a> — відкрий її у Word (якщо вгорі жовта смуга «Захищений перегляд», натисни «Увімкнути редагування») і збережи у своїй папці під своїм прізвищем. Завдання «Колонтитули», «Стовпці й розділи», «Багаторівневий список» і «Символи, індекси й формули» виконуються в цьому одному документі.<\/p><p>Працюй у своєму документі «Науковий вісник». Виконай за слайдом:<\/p>\n      <ol><li><b>Вставлення › Колонтитули › Верхній колонтитул<\/b> → шаблон → надрукуй назву вісника (напр. «Науковий вісник 9-А»).<\/li>\n      <li><b>Вставлення › Колонтитули › Номер сторінки › Внизу сторінки<\/b> → шаблон.<\/li>\n      <li>У нижньому колонтитулі: вкладка <b>Колонтитули › Дата й час<\/b> → формат → OK.<\/li>\n      <li>Вкладка <b>Колонтитули<\/b> → прапорець <b>Особливий колонтитул для першої сторінки<\/b>.<\/li><\/ol>"
