    <section id="task-head" class="task-head"><h1>Чи пропустить Access?</h1></section>

  <script src="engine/type-picker.js"></script>
  <script src="engine/access-lab.js"></script>
  <script src="engine/summaries.js"></script>
  <script>
    TaskRuntime.start({
  "id": "db-03",
  "game": "lk-sort",
  "taskId": "verdict",
  "data": {
    "hint": "У таблиці «Класи» вже є 10-А, 10-Б, 11-А, 11-Б; у кожному класі є учні.",
    "buckets": [
      {
        "id": "allow",
        "label": "✓ Access дозволить"
      },
      {
        "id": "deny",
        "label": "✗ Access відхилить"
      }
    ],
    "items": [
      {
        "id": "v1",
        "text": "Додати в «Учні» нового учня з класом «10-А»",
        "bucket": "allow",
        "why": "Клас 10-А є в таблиці «Класи» — посилання правильне."
      },
      {
        "id": "v2",
        "text": "Додати в «Учні» учня з класом «10-В»",
        "bucket": "deny",
        "why": "Класу 10-В немає в таблиці «Класи» — це порушення цілісності даних."
      },
      {
        "id": "v3",
        "text": "Видалити клас «11-Б», у якому є учні",
        "bucket": "deny",
        "why": "Учні 11-Б залишилися б без класу. Без «Каскадного видалення» Access цього не дозволить."
      },
      {
        "id": "v4",
        "text": "Додати в «Класи» ще один запис «10-А»",
        "bucket": "deny",
        "why": "Клас — первинний ключ, значення не можуть повторюватися («Порушення ключа»)."
      },
      {
        "id": "v5",
        "text": "Імпортувати аркуш «Учні», поки таблиця «Класи» ще порожня",
        "bucket": "deny",
        "why": "Кожен учень посилався б на неіснуючий клас — Access не імпортує ці записи. Спочатку імпортуй «Класи»."
      },
      {
        "id": "v6",
        "text": "Створити зв’язок між полем «Автонумерація» і полем «Число» (Довге ціле число) з цілісністю даних",
        "bucket": "allow",
        "why": "Це єдиний дозволений виняток: автонумерація зберігається як довге ціле число."
      },
      {
        "id": "v7",
        "text": "Створити зв’язок між «Клас» (Короткий текст) і полем «Клас» типу «Число» з цілісністю даних",
        "bucket": "deny",
        "why": "Пов’язані поля мають бути одного типу: текст «10-А» не може дорівнювати числу."
      },
      {
        "id": "v8",
        "text": "Імпортувати аркуш, де стовпець називається «Дата народження» (з пробілом), у поле ДатаНародження",
        "bucket": "deny",
        "why": "Під час додавання до наявної таблиці назви мають збігатися точно — поля «Дата народження» з пробілом немає."
      },
      {
        "id": "v9",
        "text": "Імпортувати аркуш «Учні», у якому стовпці стоять в іншому порядку, ніж поля в таблиці",
        "bucket": "allow",
        "why": "Якщо перший рядок містить заголовки, Access зіставляє стовпці за назвами, а не за порядком."
      },
      {
        "id": "v10",
        "text": "Ще раз імпортувати той самий аркуш «Класи»",
        "bucket": "deny",
        "why": "Класи 10-А…11-Б уже є, тож повтор дасть «Порушення ключа»."
      }
    ]
  }
});
  </script>

</html>
