  <script>
    TaskRuntime.start({
  "id": "db-01",
  "game": "table-inspector",
  "taskId": "inspector",
  "data": {
    "table": {
      "name": "characters",
      "columns": [
        {
          "name": "id",
          "type": "INTEGER"

        {
          "name": "first_name",

        },
        {

          "type": "TEXT"
        },
        {
          "name": "birth_date",
          "type": "TEXT"
        },
        {
          "name": "house",
          "type": "TEXT"
        },
        {
          "name": "age",
          "type": "INTEGER"
        }
      ],
      "rows": [
        {
          "id": "r1",
          "cells": [
            1,
            "Harry",
            "Potter",
            "1980-07-31",
            "Gryffindor",
            14
          ]
        },
        {
          "id": "r2",
          "cells": [
            2,
            "Ron",
            "Weasley",
            "01.03.1980",
            "Gryffindor",
            14
          ]
        },
        {
          "id": "r3",
          "cells": [
            3,
            "Hermione",
            "Granger",
            "1979-09-19",
            "Gryffindor",
            15
          ]
        },
        {
          "id": "r4",
          "cells": [
            8,
            "Draco",
            "Malfoy",
            "1980-06-05",
            "Slytherin",
            14
          ]
        },
        {
          "id": "r5",
          "cells": [
            9,
            "Cedric",
            "Diggory",
            null,
            "Hufflepuff",
            17
          ]
        },
        {
          "id": "r6",
          "cells": [
            3,
            "Fred",
            "Weasley",
            "1978-04-01",
            "Gryffindor",
            16
          ]
        },
        {
          "id": "r7",
          "cells": [
            7,
            "George",
            "Weasley",
            "1978-04-01",
            "Gryffindor",
            "шістнадцять"
          ]
        }
      ]
    },
    "steps": [
      {
        "id": "s1",
        "kind": "col",
        "answers": [
          "house"
        ],
        "text": "Познач ПОЛЕ, у якому записано гуртожиток персонажа.",
        "why": "Поле — це стовпець: у ньому той самий вид даних для всіх записів. Гуртожиток — поле house."
      },
      {
        "id": "s2",
        "kind": "row",
        "answers": [
          "r4"
        ],
        "text": "Познач ЗАПИС про Драко Мелфоя.",
        "why": "Запис — це рядок: усі дані про одного персонажа. Щоб позначити весь запис, клацають номер рядка ліворуч."

      {
        "id": "s3",
        "kind": "cell",
        "answers": [

        "id": "s5",
        "kind": "row",
        "answers": [
          "r3",

        "text": "Один запис порушує правило первинного ключа. Познач цей запис.",

      },
      {
        "id": "s6",
        "kind": "cell",
        "answers": [
          "r7:age"
        ],
        "text": "Знайди ЗНАЧЕННЯ, тип якого не відповідає полю.",

      },
      {
        "id": "s7",
        "kind": "cell",
        "answers": [
          "r2:birth_date"
        ],
        "text": "Знайди дату, записану НЕ у форматі РРРР-ММ-ДД.",
        "why": "01.03.1980 — так пишуть у документах, але в базі дату зберігаємо як 1980-03-01. Тоді дати правильно сортуються й порівнюються."
      },
      {
        "id": "s8",
        "kind": "cell",
        "answers": [
          "r5:birth_date"
        ],
        "text": "Знайди НЕВІДОМЕ значення.",
        "why": "NULL означає «значення відсутнє»: точної дати народження Седрика в книжках немає. Це не нуль і не помилка."
      }
    ]
  },
  "wide": true
});
