<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Підбери тип даних — Бази даних</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/platform.css">
  <link rel="stylesheet" href="../../assets/css/task.css">
  <link rel="stylesheet" href="../../assets/css/lesson-kit.css">
  <link rel="stylesheet" href="engine/sort-buckets.css">
  <link rel="stylesheet" href="engine/access.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="ai-logo">IL</span> Інтерактивні уроки</a>
  </header>
  <main id="view" class="wrap task-page">
    <section id="task-head" class="task-head"><h1>Підбери тип даних</h1></section>
    <section id="task-game" class="game-host" aria-label="Практичне завдання">
      <noscript><p class="err">Для виконання завдання увімкніть JavaScript.</p></noscript>
    </section>
    <section id="task-result" class="task-result" hidden aria-live="polite"></section>
    <nav id="task-nav" class="task-nav" aria-label="Інші завдання"></nav>
  </main>

  <script src="../../data/catalog.js"></script>
  <script src="../../assets/js/task-runtime.js"></script>
  <script src="../../assets/js/lesson-kit.js"></script>
  <script src="engine/sort-buckets.js"></script>
  <script src="engine/type-picker.js"></script>
  <script src="engine/access-lab.js"></script>
  <script src="engine/summaries.js"></script>
  <script>
    TaskRuntime.start({
  "id": "db-02",
  "game": "type-picker",
  "taskId": "picker",
  "data": {
    "types": [
      "Короткий текст",
      "Довгий текст",
      "Число",
      "Дата й час",
      "Грошова одиниця",
      "Так/Ні",
      "Автонумерація",
      "Гіперпосилання",
      "Не зберігати в базі"
    ],
    "sizes": [
      "Байт",
      "Ціле число",
      "Довге ціле число",
      "Подвійне (дробове)"
    ],
    "fields": [
      {
        "id": "c1",
        "table": "Класи",
        "name": "Клас",
        "samples": [
          "10-А",
          "11-Б"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Назва класу містить літеру й дефіс — це текст. Вистачить розміру 5."
      },
      {
        "id": "c2",
        "table": "Класи",
        "name": "Паралель",
        "samples": [
          "10",
          "11"
        ],
        "accept": [
          [
            "Число",
            "Байт"
          ],
          [
            "Число",
            "Ціле число"
          ]
        ],
        "why": "Ціле число до 255 — найощадливіше «Число» з розміром «Байт» («Ціле число» теж годиться)."
      },
      {
        "id": "c3",
        "table": "Класи",
        "name": "Профіль",
        "samples": [
          "Інформатичний",
          "Філологічний"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Коротка назва — «Короткий текст»."
      },
      {
        "id": "c4",
        "table": "Класи",
        "name": "Кабінет",
        "samples": [
          "204",
          "112",
          "301-а"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Пастка: «301-а» містить літеру, а з номерами кабінетів не рахують. Тому це текст, хоч більшість значень — цифри."
      },
      {
        "id": "c5",
        "table": "Класи",
        "name": "КласнийКерівник",
        "samples": [
          "Коваленко Ірина Петрівна"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "ПІБ уміщується в 255 символів — «Короткий текст». Зберігаємо його лише в таблиці «Класи», а не в кожного учня."
      },
      {
        "id": "s0",
        "table": "Учні",
        "name": "КодУчня",
        "samples": [
          "в Excel немає",
          "база нумерує сама: 1, 2, 3…"
        ],
        "accept": [
          [
            "Автонумерація"
          ]
        ],
        "why": "Номер, який ставить сама база, — «Автонумерація». Він стане первинним ключем таблиці «Учні»."
      },
      {
        "id": "s1",
        "table": "Учні",
        "name": "Прізвище",
        "samples": [
          "Андрієнко",
          "Бойко"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Коротке слово — «Короткий текст». Так само Ім’я й ПоБатькові."
      },
      {
        "id": "s2",
        "table": "Учні",
        "name": "ДатаНародження",
        "samples": [
          "14.03.2010",
          "02.11.2010"
        ],
        "accept": [
          [
            "Дата й час"
          ]
        ],
        "why": "Дату зберігаємо як «Дата й час»: тоді її можна сортувати, порівнювати й обчислювати з неї вік."
      },
      {
        "id": "s3",
        "table": "Учні",
        "name": "Вік",
        "samples": [
          "16",
          "15"
        ],
        "accept": [
          [
            "Не зберігати в базі"
          ]
        ],
        "why": "Вік обчислюється з дати народження й змінюється щороку. Збережений вік за рік стане хибним — тому поля «Вік» у базі немає."
      },
      {
        "id": "s4",
        "table": "Учні",
        "name": "Клас",
        "samples": [
          "10-А",
          "11-Б"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Це зовнішній ключ: його тип і розмір мають збігатися з полем «Клас» таблиці «Класи» — «Короткий текст» (5)."
      },
      {
        "id": "s5",
        "table": "Учні",
        "name": "Телефон",
        "samples": [
          "+380990000101",
          "+380990000102"
        ],
        "accept": [
          [
            "Короткий текст"
          ]
        ],
        "why": "Пастка: цифри — ще не число. З телефоном не рахують, а «+» і нулі на початку в числовому полі зникли б."
      },
      {
        "id": "s6",
        "table": "Учні",
        "name": "Email",
        "samples": [
          "marta.andriienko@lyceum.example"
        ],
        "accept": [
          [
            "Короткий текст"
          ],
          [
            "Гіперпосилання"
          ]
        ],
        "why": "Адреса пошти — текст. «Короткий текст» найпростіший; «Гіперпосилання» теж можна, але імпортувати й шукати текст зручніше."
      },
      {
        "id": "s7",
        "table": "Учні",
        "name": "ПільговеХарчування",
        "samples": [
          "ІСТИНА",
          "ХИБНІСТЬ"
        ],
        "accept": [
          [
            "Так/Ні"
          ]
        ],
        "why": "Лише два можливі значення — «Так/Ні». В Access це прапорець."
      },
      {
        "id": "s8",
        "table": "Учні",
        "name": "СереднійБал",
        "samples": [
          "10,4",
          "8,7"
        ],
        "accept": [
          [
            "Число",
            "Подвійне (дробове)"
          ]
        ],
        "why": "Бал має дробову частину, тож потрібне «Число» з розміром для дробових чисел. «Байт» чи «Ціле число» відкинули б «,4»."
      },
      {
        "id": "s9",
        "table": "Учні",
        "name": "Примітка",
        "samples": [
          "Учасниця обласної олімпіади з інформатики 2025 року; входить до учнівського…"
        ],
        "accept": [
          [
            "Довгий текст"
          ]
        ],
        "why": "Примітка може бути довшою за 255 символів — для цього є «Довгий текст»."
      }
    ]
  },
  "wide": true
});
  </script>
</body>
</html>
